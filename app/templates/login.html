{% extends "base.html" %}

{% block title %}Login — Cloud FinOps Optimizer{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 48px; height: 48px; margin: 0 auto 1rem; font-size: 1.5rem;">CF</div>
      <h2 style="font-size: 1.5rem; font-weight: 700;">Sign In to FinOps Platform</h2>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">Enter your credentials to continue</p>
    </div>

    {% if error %}
      <div class="alert alert-danger" style="margin-bottom: 1.25rem; padding: 0.75rem 1rem; font-size: 0.875rem;">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="identifier" class="form-label">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-input" required placeholder="Enter username or email" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
